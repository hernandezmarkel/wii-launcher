# CI del launcher: compila, prueba y empaqueta en cada push y PR. NO publica nada ni usa secretos.
# Las releases solo las hace release.yml con una etiqueta vX.Y.Z aprobada (docs/updater/04-publicacion.md).
# Nunca compila los ports de Wii: este repo no los contiene.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher (Windows x86_64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            git zip unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Nada no publicable en el repo (discos, binarios, claves, tokens)
        run: bash tools/comprobar-publicable.sh

      - name: Fuente Inter (hash fijo)
        run: bash tools/descargar-fuentes.sh "$PWD/_fonts"

      - name: Configurar (build normal, sin modo de pruebas)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWL_UPDATER_TESTING=OFF -DWL_INTER_DIR="$PWD/_fonts"

      - name: Compilar
        run: |
          start=$(date +%s)
          cmake --build build -j 4
          echo "Compilación del launcher: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests (contrato, adaptadores y updater)
        run: ./build/wl_tests.exe

      - name: Empaquetar (artefacto interno de CI, no es una actualización)
        run: bash tools/empaquetar.sh build dist-ci

      - name: Subir artefacto de CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wii-launcher-ci-${{ github.sha }}
          path: dist-ci/WiiLauncher-*-actualizacion.zip
          retention-days: 14
          if-no-files-found: error
